user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────
    # Secrets that legitimately travel in the query string — the WebSocket
    # handshake's ?token= JWT and AbacatePay's ?webhookSecret= — must not
    # land in the access log. The map blanks the value of either parameter
    # (each applied once, in sequence, so both can be masked on one URL);
    # the log line is rebuilt from the masked URI instead of "$request".
    map $request_uri $request_uri_masked_1 {
        default $request_uri;
        "~*^(?<pre>.*[?&]token=)[^&]*(?<post>.*)$" "${pre}[redacted]${post}";
    }
    map $request_uri_masked_1 $request_uri_masked {
        default $request_uri_masked_1;
        "~*^(?<pre>.*[?&]webhookSecret=)[^&]*(?<post>.*)$" "${pre}[redacted]${post}";
    }
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_uri_masked $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    server_tokens      off;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml font/woff2;

    # ── WebSocket upgrade map (used by api.conf) ──────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=general:10m rate=120r/m;

    # ── Virtual host includes ─────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
