# ── docs.replider.com — published API reference (Redoc + OpenAPI 3.1) ────────
# US-194: serves the static Redoc viewer and the versioned OpenAPI 3.1 spec
# generated by `make swagger-v3`. Pure static files (nginx/docs/), no upstream
# proxy. The spec is versioned by URL path (/openapi/v1/…); a future breaking
# version is published at /openapi/v2/… alongside it.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name docs.replider.com;

    include /etc/nginx/snippets/ssl.conf;

    root  /etc/nginx/docs;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "DENY"                            always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    # Redoc loads its standalone bundle from the CDN, web-fonts from Google,
    # spawns a web worker (blob:) and uses eval in its bundled runtime; the
    # spec itself is fetched same-origin (connect-src 'self').
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.redoc.ly; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # Rate limit
    limit_req zone=general burst=20 nodelay;

    # ── OpenAPI spec — served as static JSON/YAML, browsable by external
    #    tools (Stoplight, Postman, code generators), hence permissive CORS.
    location /openapi/ {
        add_header Access-Control-Allow-Origin "*" always;
        types {
            application/json json;
            application/yaml yaml yml;
        }
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
