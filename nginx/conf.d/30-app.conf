# ── app.replider.com — Flutter Web SPA ───────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name app.replider.com;

    include /etc/nginx/snippets/ssl.conf;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options "nosniff"                            always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy     "camera=(self), microphone=(self), geolocation=(), identity-credentials-get=*, publickey-credentials-get=*" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com https://static.cloudflareinsights.com https://accounts.google.com https://apis.google.com https://connect.facebook.net; script-src-elem 'self' 'unsafe-inline' https://www.gstatic.com https://static.cloudflareinsights.com https://accounts.google.com https://apis.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob: https://storage.googleapis.com; connect-src 'self' blob: https://api.replider.com wss://api.replider.com https://storage.googleapis.com https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://cloudflareinsights.com https://accounts.google.com https://oauth2.googleapis.com https://graph.facebook.com https://www.facebook.com; frame-src 'self' https://api.replider.com https://accounts.google.com https://www.facebook.com https://web.facebook.com; worker-src 'self' blob:; child-src 'self' blob: https://api.replider.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Rate limit
    limit_req zone=general burst=30 nodelay;

    # An API-shaped path must never fall through to the SPA shell.
    #
    # `location /` proxies to the app container, whose own nginx ends in
    # `try_files $uri /index.html` — so a request to /v1/... came back as
    # HTTP 200 with a page of HTML. On 2026-09-09 a build shipped with
    # `API_BASE_URL=https://app.replider.com/v1` (the API lives on
    # api.replider.com) and every single call answered 200 with index.html.
    # The browser's network tab, `curl -I` and the access log all reported a
    # healthy system; the API's own log was silent, because no request ever
    # reached it.
    #
    # 404 rather than proxying to the API on purpose: app.replider.com is not
    # an API origin, and quietly making it one would hide exactly this
    # misconfiguration behind an app that appears to work. A wrong base URL
    # has to fail where it is wrong, and say which host is the right one.
    # `/health` is in the list for the same reason, learned the hard way: it
    # answered 200 with the SPA shell, so "curl app.replider.com/health → 200"
    # read as a healthy API while saying nothing about the API at all. It
    # fooled the author of this comment six times in one session. The app
    # container's own healthcheck hits `/` directly and does not use this
    # path; the access log shows no external monitor on it either.
    location ~ ^/(v1|ws|health)(/|$) {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        return 404 '{"error":"NOT_AN_API_ORIGIN","message":"app.replider.com serves the dashboard, not the API. Use https://api.replider.com"}';
    }

    location / {
        proxy_pass http://app:80;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 60s;
    }
}
