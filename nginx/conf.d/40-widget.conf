# ── cdn.replider.com — Embeddable webchat widget assets ─────────────────────
# Public, anonymous, cacheable. Loaded by <script src> tags installed on
# customer websites. The actual chat traffic goes to api.replider.com (with
# the per-channel CORS check).
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cdn.replider.com;

    include /etc/nginx/snippets/ssl.conf;

    # Security headers — minimal because this is only static JS/CSS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Let any site embed the widget — that's the whole point.
    add_header Access-Control-Allow-Origin "*" always;
    # Frame embedding: allow (some hosts wrap pages in iframes; the widget
    # itself does not render inside an iframe but be permissive on the asset).
    add_header X-Frame-Options "ALLOWALL" always;

    # Lower rate limit acceptable: this is a CDN.
    limit_req zone=general burst=60 nodelay;

    location / {
        proxy_pass http://widget:80;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 30s;
    }
}

# HTTP -> HTTPS for cdn.replider.com (extends 00-default.conf which doesn't
# list cdn). Keeping it in this file so the conf is self-contained.
server {
    listen      80;
    listen      [::]:80;
    server_name cdn.replider.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
