# ── HTTP: redirect to HTTPS ───────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name replider.com www.replider.com api.replider.com app.replider.com docs.replider.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
