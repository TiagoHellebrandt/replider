# ── replider.com — Astro landing page ────────────────────────────────────────

# www → apex redirect
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.replider.com;

    include /etc/nginx/snippets/ssl.conf;

    return 301 https://replider.com$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name replider.com;

    include /etc/nginx/snippets/ssl.conf;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options "nosniff"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.replider.com https://www.google-analytics.com https://www.googletagmanager.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Rate limit
    limit_req zone=general burst=30 nodelay;

    location / {
        proxy_pass http://web:80;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_pragma;
    }
}
