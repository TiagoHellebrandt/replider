# ── api.replider.com — Go API + WebSocket ────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.replider.com;

    include /etc/nginx/snippets/ssl.conf;
    # Visitor IP from Cloudflare (only trusted from Cloudflare ranges). The
    # API in turn trusts only this proxy's address (TRUSTED_PROXIES), so
    # c.ClientIP() is the visitor and not whatever X-Forwarded-For a caller
    # typed.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Allow larger payloads for media uploads (base64 GCS credentials etc.)
    client_max_body_size 50m;

    # Security headers
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-Frame-Options        "DENY"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # API rate limit (stricter)
    limit_req zone=api burst=20 nodelay;

    # ── REST endpoints ────────────────────────────────────────────────────
    location / {
        proxy_pass http://api:8080;
        include    /etc/nginx/snippets/proxy.conf;

        # WebSocket upgrade (used by /ws endpoint)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 180s: above the API's 120s WriteTimeout, which is itself above the
        # longest per-route budget (100s, reading a catalogue PDF through the
        # model). nginx giving up first turns an answer the API was about to
        # send into a 504 with no explanation in it.
        proxy_read_timeout 180s;   # long for streaming / AI responses
    }

    # ── OAuth consent page (MCP / Claude) ──────────────────────────────────
    # The login+consent page is server-rendered HTML with inline CSS; the
    # server-wide CSP (default-src 'none') would strip its styling. NOTE:
    # add_header in a nested location REPLACES every parent add_header, so
    # the other security headers are repeated here.
    location /oauth/ {
        proxy_pass http://api:8080;
        include    /etc/nginx/snippets/proxy.conf;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-Frame-Options        "DENY"                             always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self' https:; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # ── Original email view (sandboxed iframe inside the app) ─────────────
    # The Go handler serves this document with its own purpose-built CSP
    # (default-src 'none'; img-src data:; sandbox). The server-wide headers
    # must NOT stack on top of it: two CSP headers enforce their
    # INTERSECTION, so the blanket `default-src 'none'` erased the data:
    # images the handler explicitly allows, and X-Frame-Options DENY +
    # `frame-ancestors 'none'` blocked the app's iframe outright ("este
    # conteúdo está bloqueado"). Framing is allowed to the app origin only.
    location = /v1/messages/original {
        proxy_pass http://api:8080;
        include    /etc/nginx/snippets/proxy.conf;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors https://app.replider.com" always;
    }

    # ── Prometheus scrape — never public ──────────────────────────────────
    # Route names, tenant counts and error rates are for the scraper on the
    # backend network only. The API additionally requires METRICS_TOKEN as a
    # bearer when that variable is set (second lock, in case this rule is
    # ever lost). Docker's bridge ranges cover the `replider_backend`
    # network the scraper lives on.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny  all;
        proxy_pass http://api:8080/metrics;
        include    /etc/nginx/snippets/proxy.conf;
        access_log off;
    }

    # ── Health check — skip rate limit and access log ─────────────────────
    location = /health {
        proxy_pass http://api:8080/health;
        include    /etc/nginx/snippets/proxy.conf;
        access_log off;
    }
}
