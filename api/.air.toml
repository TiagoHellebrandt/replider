root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  entrypoint = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  # sql included so a new file under db/migrations triggers a rebuild,
  # which in turn runs the pre_cmd below and applies it to the dev DB.
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  # Idempotent `migrate up` on every rebuild: a no-op when the DB is
  # already at the latest version, applies pending files otherwise.
  # Air inherits DB_URL from entrypoint.dev.sh (which exports it).
  pre_cmd = ["sh -c 'migrate -path /app/db/migrations -database \"${DB_URL}\" up 2>&1 | grep -v \"no change\" || true'"]
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
