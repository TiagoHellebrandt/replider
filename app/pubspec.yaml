name: app
description: "Replider App"
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  desktop_drop: ^0.7.1
  dio: ^5.0.0
  drift: ^2.20.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path-based URL strategy on web (usePathUrlStrategy) so deep links like
  # /reset-password?token=… are read from the path instead of the hash.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4+4
  google_sign_in_platform_interface: ^2.4.5
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.0
  retrofit: ^4.9.2
  riverpod_annotation: ^4.0.0
  url_launcher: ^6.3.1
  slang: ^4.15.0
  slang_flutter: ^4.14.0
  sqlite3_flutter_libs: ^0.6.0+eol
  web_socket_channel: ^3.0.3
  flutter_svg: ^2.3.0
  record: ^6.0.0
  just_audio: ^0.9.40
  qr_flutter: ^4.1.0
  sentry_flutter: ^8.14.2
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  rename: ^3.1.0
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.0+1
  slang_build_runner: ^4.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/

  # Inter Variable, bundled rather than fetched.
  #
  # The theme has asked for 'Inter' in four places since the start and
  # nothing ever supplied it, so every build fell back to the platform
  # default: Roboto on Android, San Francisco on Apple, whatever Chrome
  # picks on Windows. The product literally looked different on every
  # machine it was demonstrated on — including the customer's, if they
  # opened the link.
  #
  # Bundled as an asset, not via google_fonts, to match the project's
  # no-network-at-runtime posture: a demo in a hospital's meeting room
  # cannot depend on their wifi resolving fonts.googleapis.com.
  #
  # One file covers every weight (it is a variable font); the weight list
  # below is what lets Flutter map w400..w800 onto its axis.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
