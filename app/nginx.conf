server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip         on;
    gzip_static  on;
    gzip_types   text/css application/javascript application/wasm;

    # ── SPA routing ───────────────────────────────────────────────────────
    # Flutter Web is a SPA — all routes must return index.html so the
    # Flutter router can handle the path client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cacheable hashed assets (immutable) ──────────────────────────────
    # Files under /assets/ and /canvaskit/ have content-hashed filenames
    # generated by `flutter build web` (e.g. AssetManifest.json gets
    # rewritten with hashes). These can be cached forever.
    #
    # IMPORTANT: this MUST be a `^~` prefix match (not a regex), otherwise
    # the regex below for *.js / *.wasm would also catch flutter_bootstrap.js
    # and main.dart.js, which are NOT hashed and MUST revalidate.
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ^~ /canvaskit/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static images and PWA icons (medium-term cache) ──────────────────
    # These don't change often and don't break the app if stale for a few
    # days. The `expires 30d` directive emits both Expires and a
    # Cache-Control: max-age header — no need to also `add_header`, that
    # would just duplicate it.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        access_log off;
    }

    # ── Flutter Web entry files MUST always revalidate ───────────────────
    # These filenames are stable across builds (no content hash), so the
    # only way to push updates is to make every browser revalidate on each
    # request. `no-cache` means: store but always re-fetch with If-None-Match.
    # Setting Cache-Control to a value Cloudflare also respects ensures the
    # CDN doesn't serve stale copies either.
    #
    # Files this covers (all in the web root):
    #   - index.html               page wrapper
    #   - flutter_bootstrap.js     loader, picks renderer + service worker
    #   - flutter.js               legacy loader (still emitted)
    #   - main.dart.js             compiled Dart bundle (this changes EVERY build)
    #   - flutter_service_worker.js  PWA shell, cache manifest
    #   - manifest.json            PWA manifest (icons, theme)
    #   - version.json             build metadata Flutter uses to detect updates
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
