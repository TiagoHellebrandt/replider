name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/_deploy-frontend.yml'
  # US-188: gate PRs that touch web on the format check. Only the
  # lightweight `format` job runs on PRs; test/build-push/deploy are guarded
  # to push/dispatch events so the GHCR push (and Lighthouse) never run for
  # a PR.
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # NO workflow_dispatch. A manual dispatch could build-push+deploy from any
  # branch, skipping the checks a merge to main carries — same side door
  # closed on deploy-api. Emergency procedure (with mandatory logging):
  # docs/deploy-emergencia.md.

env:
  IMAGE: ghcr.io/caritium/replider-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # US-188: prettier format gate. Runs on PRs (and push). Config in
  # web/.prettierrc.json; web/.prettierignore excludes dist, generated blog
  # MDX content, and Layout.astro (prettier-plugin-astro cannot parse its
  # conditional, JSX-wrapped inline analytics script).
  format:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: prettier check
        run: npm run format:check

  test:
    name: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lighthouse CI (perf >= 80, SEO >= 95)
        run: npm run test:lighthouse

  build-push:
    name: Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Astro site
        working-directory: web
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          # Sales-led (2026-08-19): the calendar page "Agendar conversa"
          # points at. A production-web VARIABLE (public URL). Empty = the
          # CTA falls back to WhatsApp.
          PUBLIC_BOOKING_URL: ${{ vars.PUBLIC_BOOKING_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-push
    # Redundant with build-push's guard on purpose: if that condition is
    # ever loosened, this one still refuses to ship anything but main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-frontend.yml
    with:
      service: web
      environment: production-web
      environment_url: https://replider.com
    secrets: inherit
