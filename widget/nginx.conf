server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    charset     utf-8;

    # Tight CORS so widget assets can be loaded from any origin (they're
    # public JS/CSS — no auth, no secrets). The actual API CORS is enforced
    # separately at the API tier per channel allowed_origins.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/wasm;

    # Long-cache the JS bundle: filename is stable but the customer's browser
    # only refetches when the file changes (we use Last-Modified + ETag).
    # If we ever ship breaking changes, we'll either bump the bundle URL
    # (widget.v2.js) or invalidate via cache-bypass header.
    location ~* \.(js|css|map)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Nothing else served — this container is purely a CDN for the widget assets.
    location / {
        return 404;
    }
}
