# WAL archiving for wal-g (US-F002). Included from postgresql.conf by the
# entrypoint, so a crash-recovery start gets the same settings as a clean one.

# `replica` is the minimum level that produces archivable WAL. `minimal`
# (the default in some tuned images) makes point-in-time recovery impossible.
wal_level = replica

archive_mode = on
# A failing archive_command makes Postgres RETRY the segment forever rather
# than dropping it — WAL accumulates on disk until archiving recovers. That
# is the correct trade (disk pressure beats a hole in the recovery chain),
# and it is why backup-verify.sh alerting matters.
archive_command = '/usr/local/bin/wal-g wal-push %p'
archive_timeout = 300

# Keep enough WAL for archiving to catch up after a blip without letting a
# broken archiver fill the disk unbounded.
max_wal_size = 2GB
min_wal_size = 256MB
