# ── Root language negotiation ─────────────────────────────────────────────
# Map the browser's Accept-Language header to a locale prefix so the bare
# root `/` can be 301-redirected server-side (crawler-safe) instead of via a
# client-side JS redirect, which Google may penalise. Default is English;
# any Accept-Language whose primary tag is Portuguese gets /pt/.
# pt-only desde a landing v2 — a negociação de idioma virou constante.
map $http_accept_language $root_redirect_lang {
    default  pt;
    ~*^pt    pt;
}

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;

    # ── Root 301: server-side Accept-Language detection ──────────────────
    # Replaces the JS/meta-refresh redirect baked into the pre-built
    # index.html. 301 (permanent) so the negotiated locale home becomes the
    # indexed canonical. The static index.html stays as a no-JS fallback for
    # hosts that don't run this nginx (e.g. local `astro preview`).
    location = / {
        return 301 /$root_redirect_lang/;
    }
    location = /index.html {
        return 301 /$root_redirect_lang/;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip         on;
    gzip_static  on;
    gzip_types   text/css application/javascript image/svg+xml application/json;

    # ── Routing ───────────────────────────────────────────────────────────
    # Astro generates a real .html file for every route, so try the file
    # first, then the directory index, then a .html variant, then 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro i18n: /pt/* routes are also pre-rendered as real files
    location /pt/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Cache: immutable hashed assets (JS/CSS/fonts) ─────────────────────
    location ~* \.(js|css|woff2|woff|ttf|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: images ─────────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── No-cache: HTML pages ──────────────────────────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
