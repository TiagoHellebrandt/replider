# Alertmanager configuration wiring Replider SLO alerts (infra/alerts.yaml)
# to Slack and Discord (US-070).
#
# Secrets are injected as environment variables at container start — Alertmanager
# does NOT expand env vars in this file natively, so deployments either:
#   (a) template this file with envsubst before mounting it, or
#   (b) use a static rendered copy with the real URLs.
# We keep the placeholders here and render at deploy time so no webhook secret
# is committed. The relevant vars (see .env.common.example) are:
#   SLACK_ALERT_WEBHOOK_URL   — Slack Incoming Webhook URL
#   DISCORD_ALERT_WEBHOOK_URL — Discord channel webhook URL (Alertmanager v0.25+
#                               supports discord_configs natively)

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "slo"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical SLO breaches page both channels immediately.
    - matchers:
        - severity = "critical"
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    slack_configs:
      - api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        channel: "#alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          <{{ .Annotations.runbook_url }}|Runbook>
          {{ end }}

  - name: critical
    slack_configs:
      - api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        channel: "#alerts-critical"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          <{{ .Annotations.runbook_url }}|Runbook>
          {{ end }}
    discord_configs:
      - webhook_url: "${DISCORD_ALERT_WEBHOOK_URL}"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          [Runbook]({{ .Annotations.runbook_url }})
          {{ end }}
